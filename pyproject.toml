[build-system]
requires = ["setuptools>=61", "wheel", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "pypff"
version = "1.1.0"
description = "Modernized PFF I/O library for PanoSETI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL" }
authors = [
    { name = "Wei Liu", email = "liuwei_berkeley@berkeley.edu" },
    { name = "Nicolas Rault-Wang", email = "nraultwang@berkeley.edu" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License (GPL)",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=1.24.0",
    "orjson>=3.9.0",
    "pydantic>=2.5.0",
    "rich>=13.0.0",
    "astropy",
    "scipy",
    "matplotlib",
    "plotly",
    "tqdm",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "dask",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
pypff = "pypff.cli:app"


[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "I", "ASYNC", "RUF", "SIM"]
ignore = [
    "E501",   # line too long – handled separately
    "B008",   # function calls in default args (common in Pydantic)
    "F841",   # unused variables
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = [
	"E501",
	"E402",
	"F401"
] # Add rule codes you want to ignore here

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.14"
# exclude = ["ci"]

strict = true
check_untyped_defs = true
strict_equality = true
extra_checks = true
ignore_missing_imports = true
warn_return_any = false
disallow_untyped_defs = true
disallow_incomplete_defs = false
warn_unused_ignores = false
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
